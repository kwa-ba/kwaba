target-version = "py312"
line-length = 120
extend-exclude = ["migrations", ".venv"]

[lint]
# Phase 1: only the rules that reveal bugs (syntax, undefined names, unused imports).
# Import sorting (I) and `ruff format` will come in a dedicated PR, so as not to create
# conflicts with the open branches.
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# __init__.py files re-export the classes of their package
"__init__.py" = ["F401"]
"config/settings.py" = ["S105"]
"shared/securite/limites.py" = ["S311"]
"apps/users/infrastructure/external/GoogleAPITokenVerifier.py" = ["S105"]
# Ledger SQL: the f-strings only insert module constants (SIGNE, RESULTAT…) and fixed WHERE fragments;
# every value is a %s parameter
"apps/finance/infrastructure/persistence/pilotage.py" = ["S608"]
"apps/finance/infrastructure/persistence/repositories.py" = ["S608"]
"apps/finance/infrastructure/persistence/restitutions.py" = ["S608"]
# Seeded generator of the preprod demo data, refused in production
"apps/paiements/management/commands/seed_finance_demo.py" = ["S311"]
"tests/**" = ["S"]

[format]
quote-style = "single"
